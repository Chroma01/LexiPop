  <!-- bold L headword -->
  <path fill="#0D2F86" d="M30 26 H44 V46 H58 V58 H30 Z"/>
  <!-- two definition lines -->
  <g fill="#A8C4FF">
    <rect x="66" y="28" width="40" height="8" rx="4"/>
    <rect x="66" y="44" width="30" height="8" rx="4"/>
  </g>
