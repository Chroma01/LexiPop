<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E6DE8"/>
      <stop offset="1" stop-color="#0D2F86"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#bg)"/>

  <!-- article text below (light blue), one word selected (white chip) -->
  <g fill="#A8C4FF">
    <rect x="20" y="84" width="40" height="8" rx="4"/>
    <rect x="96" y="84" width="12" height="8" rx="4"/>
    <rect x="20" y="100" width="60" height="8" rx="4"/>
  </g>
  <rect x="64" y="82" width="28" height="12" rx="6" fill="#FFFFFF"/>

  <!-- oversized popup card at 16px: no tail, no shadow -->
